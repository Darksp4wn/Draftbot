<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101d">
<title>DraftBot 2026 Offline</title>

<style>
:root{
  --bg:#08101d;
  --card:#141e31;
  --card2:#1d2a43;
  --border:#30415f;
  --text:#f5f7ff;
  --muted:#9ba9c3;
  --green:#55d6a4;
  --blue:#69adff;
  --red:#ff7180;
  --yellow:#ffd166;
  --purple:#ad8cff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  overflow-x:hidden;
}

body{
  color:var(--text);
  background:var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-overflow-scrolling:touch;
}

button,
select,
input{
  font:inherit;
}

button{
  border:0;
  border-radius:11px;
  padding:11px 13px;
  color:var(--text);
  background:var(--card2);
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

button.primary{
  color:#06140f;
  background:var(--green);
  font-weight:800;
}

button.danger{
  background:#642b39;
}

button.small{
  padding:7px 10px;
  font-size:12px;
}

select,
input{
  width:100%;
  padding:10px;
  color:var(--text);
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
}

input::placeholder{
  color:#71819e;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:13px 14px;
  background:#08101ded;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

main{
  max-width:1280px;
  margin:auto;
  padding:12px 12px 150px;
}

h1{
  margin:0;
  font-size:21px;
}

h2{
  margin:0 0 12px;
  font-size:16px;
}

h3{
  margin:13px 0 7px;
  font-size:14px;
}

.sub,
.muted{
  color:var(--muted);
  font-size:12px;
}

.between{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.layout{
  display:grid;
  gap:12px;
}

@media(min-width:900px){
  .layout{
    grid-template-columns:400px minmax(0,1fr);
  }
}

.card{
  padding:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.settings label{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:var(--muted);
  font-size:12px;
}

.status{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:12px;
}

.stat{
  padding:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:19px;
}

.stat span{
  color:var(--muted);
  font-size:11px;
}

.turn{
  margin-bottom:12px;
  padding:14px;
  background:var(--card2);
  border-radius:14px;
}

.turn.mine{
  background:#12372e;
  outline:2px solid var(--green);
}

.turn strong{
  display:block;
  margin-top:3px;
  font-size:19px;
}

.recommendation{
  background:linear-gradient(135deg,#14382f,#17253d);
  border-color:#347862;
}

@media(min-width:900px){
  .recommendation{
    position:sticky;
    top:76px;
    z-index:5;
  }
}

.bot-score{
  float:right;
  color:var(--yellow);
  font-size:28px;
  font-weight:900;
}

.recommended-name{
  margin:4px 0;
  font-size:23px;
  font-weight:850;
}

.badge{
  display:inline-block;
  margin:2px;
  padding:3px 8px;
  color:#e0ebff;
  background:#30415e;
  border-radius:20px;
  font-size:11px;
}

.reason{
  margin:7px 0;
  padding-left:20px;
  color:#d9e3f5;
  font-size:13px;
  line-height:1.5;
}

.filters{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:8px;
  -webkit-overflow-scrolling:touch;
}

.filters button{
  flex:0 0 auto;
  padding:8px 11px;
}

.filters button.active{
  color:#061321;
  background:var(--blue);
  font-weight:800;
}

.search{
  margin:8px 0 10px;
}

.board{
  display:grid;
  gap:8px;
  max-height:min(64vh,720px);
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:3px;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

.player{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
  min-height:78px;
  padding:8px;
  background:#111a2c;
  border:1px solid var(--border);
  border-radius:12px;
}

.player-main{
  display:flex;
  align-items:center;
  min-width:0;
  gap:9px;
}

.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  width:45px;
  height:45px;
  flex:0 0 45px;
  color:#e4edff;
  background:#304363;
  border-radius:50%;
  font-size:12px;
  font-weight:850;
}

.player-name{
  overflow-wrap:anywhere;
  font-weight:750;
}

.player-meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.rank{
  color:var(--yellow);
}

.actions{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.actions button{
  min-width:96px;
  padding:8px 5px;
  font-size:10px;
  font-weight:800;
}

.pick-button{
  background:#245d75;
}

.gone-button{
  color:#f0e8ff;
  background:#513d66;
}

.roster{
  display:grid;
  gap:7px;
  max-height:620px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.roster-position{
  padding:9px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#111a2c;
}

.roster-position-title{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  color:var(--muted);
  font-size:12px;
}

.roster-player{
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 0;
  border-top:1px solid #263653;
  font-size:13px;
}

.roster-player:first-of-type{
  border-top:0;
}

.roster-mini-avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  width:27px;
  height:27px;
  flex:0 0 27px;
  border-radius:50%;
  color:#e4edff;
  background:#304363;
  font-size:9px;
  font-weight:800;
}

.roster-empty{
  color:#667694;
  font-size:12px;
}

.reserve-label{
  color:var(--purple);
  font-size:11px;
}

.history{
  max-height:410px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.history-row{
  padding:7px;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.history-row.mine{
  color:var(--green);
  font-weight:750;
}

.empty{
  padding:20px;
  color:var(--muted);
  text-align:center;
}

.flex{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.snapshot{
  margin-top:10px;
  padding-top:9px;
  color:var(--muted);
  border-top:1px solid var(--border);
  font-size:11px;
  line-height:1.45;
}

.toast{
  position:fixed;
  right:12px;
  bottom:18px;
  left:12px;
  z-index:100;
  display:none;
  padding:12px 14px;
  color:#06140f;
  background:var(--green);
  border-radius:12px;
  box-shadow:0 8px 30px #0008;
  font-weight:750;
}

@media(max-width:600px){
  main{
    padding-right:9px;
    padding-left:9px;
  }

  .player{
    grid-template-columns:minmax(0,1fr) auto;
  }

  .actions button{
    min-width:90px;
  }
}
</style>
</head>

<header>
  <div class="between">
    <div>

      <div class="sub">
        Offline-Snapshot · Snake Draft · 6 Reserveplätze
      </div>
    </div>

      Reset
    </button>
  </div>
</header>

<main>
<div class="layout">

<section>

        </select>
      </label>

        Roster

    </div>

      3-WR/Superflex: 10 Starter + 6 Reserve = 16 Runden.<br>
      Die Daten sind lokal eingebettet und benötigen kein Internet.
    </div>
  </div>

  <div id="recommendationBox"
       class="card recommendation"
       style="margin-top:12px"></div>

  <div class="card" style="margin-top:12px">
    <div class="between">
      <h2>Mein Kader</h2>

      <button id="undoButton" class="small">
        ↶ Rückgängig
      </button>
    </div>

    <div id="rosterBox" class="roster"></div>
  </div>

  <div class="card" style="margin-top:12px">
    <h2>Draft-Verlauf</h2>
    <div id="historyBox" class="history"></div>
  </div>

</section>

<section>

  <div id="statusBox"></div>
  <div id="turnBox"></div>

  <div class="card">
    <div class="between">
      <h2>Spieler-Board</h2>
      <span id="availableCount" class="muted"></span>
    </div>

    <div class="search">
      <input
        id="searchInput"
        type="search"
        placeholder="Spieler, Team oder Position suchen …"
        autocomplete="off">
    </div>

    <div id="filterBox" class="filters"></div>
    <div id="boardBox" class="board"></div>
  </div>

</section>

</div>
</main>

<div id="toast" class="toast"></div>

/* DOM */
const teamsSelect = document.getElementById("teamsSelect");
const slotSelect = document.getElementById("slotSelect");

let players = [];

/* -------------------------------------------------------
   GRUNDLAGEN
------------------------------------------------------- */

function defaultState(){
  return {
    schema:2,
    teams:11,
    slot:1,
    scoring:"ppr",
    roster:"standard",
    currentPick:1,
    drafted:[],
    history:[],
    undo:[]
  };
}

function saveState(){
  localStorage.setItem(
    "draftbot2026-v2",
    JSON.stringify(state)
  );
}

function loadState(){
  try{
    const saved =
      localStorage.getItem("draftbot2026-v2");

    state =
      saved ? JSON.parse(saved) : defaultState();
  }catch(error){
    state = defaultState();
  }

  if(state.schema!==2){
    state = defaultState();
  }

  if(!Array.isArray(state.drafted)){
    state.drafted=[];
  }

  if(!Array.isArray(state.history)){
    state.history=[];
  }

  if(!Array.isArray(state.undo)){
    state.undo=[];
  }
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  return String(name || "?")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(part=>part[0])
    .join("")
    .toUpperCase();
}

function showToast(message){
  toastBox.textContent=message;
  toastBox.style.display="block";

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    toastBox.style.display="none";
  },2800);
}

/* -------------------------------------------------------
   SPIELERDATEN
------------------------------------------------------- */

function buildPlayers(){
  const seen=new Set();

  players =
    snapshotRows
      .trim()
      .split("\n")
      .map(line=>line.trim())
      .filter(Boolean)
      .map((line,index)=>{
        const parts=line.split("|");

        return {
          id:"player-"+index+"-"+parts[0],
          name:parts[0],
          team:parts[1],
          pos:parts[2],
          adp:Number(parts[3]),
          rank:0,
          positionRank:0,
          tier:1
        };
      })
      .filter(player=>{
        const key=
          player.name.toLowerCase()+
          "|"+
          player.pos;

        if(seen.has(key)){
          return false;
        }

        seen.add(key);
        return true;
      })
      .sort((a,b)=>a.adp-b.adp);

  const counters={
    QB:0,
    RB:0,
    WR:0,
    TE:0,
    K:0,
    DST:0
  };

  players.forEach((player,index)=>{
    counters[player.pos]++;

    player.rank=index+1;
    player.positionRank=counters[player.pos];

    player.tier =
      index<24
        ? 1
        : index<65
          ? 2
          : index<125
            ? 3
            : index<190
              ? 4
              : 5;
  });
}

function getPlayer(id){
  return players.find(player=>player.id===id);
}

function isGone(id){
  return state.drafted.some(item=>item.id===id);
}

function availablePlayers(){
  return players.filter(player=>!isGone(player.id));
}

function positionLabel(player){
  return player.pos+player.positionRank;
}

/* -------------------------------------------------------
   SNAKE DRAFT UND RUNDEN
------------------------------------------------------- */

function starterRounds(){
  if(state.roster==="threeWR") return 10;
  if(state.roster==="superflex") return 10;
  return 9;
}

function reserveRounds(){
  return 6;
}

function totalRounds(){
  return starterRounds()+reserveRounds();
}

function totalPicks(){
  return state.teams*totalRounds();
}

function teamAtPick(pick){
  const round=
    Math.floor((pick-1)/state.teams);

  const position=
    (pick-1)%state.teams;

  return round%2===0
    ? position+1
    : state.teams-position;
}

function isMyPick(pick=state.currentPick){
  return teamAtPick(pick)===Number(state.slot);
}

function nextOwnPick(){
  for(
    let pick=state.currentPick+1;
    pick<=totalPicks();
    pick++
  ){
    if(isMyPick(pick))return pick;
  }

  return null;
}

function isReservePick(pick){
  const round=
    Math.floor((pick-1)/state.teams)+1;

  return round>starterRounds();
}

/* -------------------------------------------------------
   ROSTER-BESATZUNG
------------------------------------------------------- */

function rosterLimits(){
  if(state.roster==="threeWR"){
    return {
      QB:1,
      RB:2,
      WR:3,
      TE:1,
      FLEX:1,
      K:1,
      DST:1
    };
  }

  if(state.roster==="superflex"){
    return {
      QB:1,
      RB:2,
      WR:2,
      TE:1,
      FLEX:1,
      SF:1,
      K:1,
      DST:1
    };
  }

  return {
    QB:1,
    RB:2,
    WR:2,
    TE:1,
    FLEX:1,
    K:1,
    DST:1
  };
}

function myPlayers(){
  return state.drafted
    .filter(item=>item.team===Number(state.slot))
    .map(item=>getPlayer(item.id))
    .filter(Boolean);
}

function myCounts(){
  const counts={
    QB:0,
    RB:0,
    WR:0,
    TE:0,
    K:0,
    DST:0
  };

  myPlayers().forEach(player=>{
    counts[player.pos]++;
  });

  return counts;
}

function rosterPlayerHtml(player,isReserve){
  return `
    <div class="roster-player">
      <div class="roster-mini-avatar">
        ${escapeHtml(initials(player.name))}
      </div>

      <div>
        <strong>${escapeHtml(player.name)}</strong>
        <div class="muted">
          ${escapeHtml(player.team)}
          · ${escapeHtml(positionLabel(player))}
          ${
            isReserve
              ? `<span class="reserve-label">· RESERVE</span>`
              : ""
          }
        </div>
      </div>
    </div>
  `;
}

function renderRoster(){
  const limits=rosterLimits();
  const grouped={
    QB:[],
    RB:[],
    WR:[],
    TE:[],
    K:[],
    DST:[]
  };

  myPlayers().forEach(player=>{
    if(grouped[player.pos]){
      grouped[player.pos].push(player);
    }
  });

  let html="";

  ["QB","RB","WR","TE","K","DST"].forEach(position=>{
    const list=grouped[position];
    const starterLimit=limits[position];

    html+=`
      <div class="roster-position">
        <div class="roster-position-title">
          <span>${position}</span>
          <strong>
            ${Math.min(list.length,starterLimit)}/${starterLimit}
          </strong>
        </div>

        ${
          list.length
            ? list.map((player,index)=>
                rosterPlayerHtml(
                  player,
                  index>=starterLimit
                )
              ).join("")
            : `<div class="roster-empty">
                 Noch kein Spieler
               </div>`
        }
      </div>
    `;
  });

  const reserveCount=
    Math.max(
      0,
      myPlayers().length-
      (
        limits.QB+
        limits.RB+
        limits.WR+
        limits.TE+
        limits.K+
        limits.DST
      )
    );

  html+=`
    <div class="roster-position">
      <div class="roster-position-title">
        <span>FLEX</span>
        <strong>—/${limits.FLEX}</strong>
      </div>

      <div class="roster-empty">
        RB/WR/TE flexibel einsetzbar.
      </div>
    </div>
  `;

  if(state.roster==="superflex"){
    html+=`
      <div class="roster-position">
        <div class="roster-position-title">
          <span>SUPERFLEX</span>
          <strong>—/1</strong>
        </div>

        <div class="roster-empty">
          QB/RB/WR/TE flexibel einsetzbar.
        </div>
      </div>
    `;
  }

  html+=`
    <div class="roster-position">
      <div class="roster-position-title">
        <span>RESERVE</span>
        <strong>${reserveCount}/6</strong>
      </div>

      <div class="roster-empty">
        Reserveplätze werden automatisch mit Spielern
        außerhalb der Starterplätze gefüllt.
      </div>
    </div>
  `;

  rosterBox.innerHTML=html;
}

/* -------------------------------------------------------
   DRAFTBOT
------------------------------------------------------- */

function needScore(player){
  const counts=myCounts();
  const limits=rosterLimits();

  if(player.pos==="QB"&&counts.QB<limits.QB)return 1;
  if(player.pos==="RB"&&counts.RB<limits.RB)return 1;
  if(player.pos==="WR"&&counts.WR<limits.WR)return 1;
  if(player.pos==="TE"&&counts.TE<limits.TE)return 1;
  if(player.pos==="K"&&counts.K<limits.K)return .4;
  if(player.pos==="DST"&&counts.DST<limits.DST)return .4;

  if(
    ["RB","WR","TE"].includes(player.pos)&&
    counts.RB+counts.WR+counts.TE<
    limits.RB+limits.WR+limits.TE+1
  ){
    return .5;
  }

  if(
    state.roster==="superflex"&&
    player.pos==="QB"&&
    counts.QB<2
  ){
    return .75;
  }

  return .08;
}

function scarcityScore(player){
  const same=
    availablePlayers()
      .filter(item=>item.pos===player.pos)
      .sort((a,b)=>a.positionRank-b.positionRank);

  const index=
    same.findIndex(item=>item.id===player.id);

  if(index<0)return 0;

  const tierLeft=
    same.filter(item=>item.tier===player.tier).length;

  const rankScarcity=
    1-index/Math.max(1,same.length);

  return rankScarcity+
    (tierLeft<=2?.35:0);
}

function survivalChance(player){
  const next=nextOwnPick();

  if(!next)return 1;

  const distance=
    Math.max(0,next-state.currentPick-1);

  let risk=.006;

  if(player.rank<=30)risk=.025;
  else if(player.rank<=80)risk=.014;
  else if(player.rank<=130)risk=.008;

  return Math.max(
    0,
    Math.min(1,1-risk*distance)
  );
}

function scoringBonus(player){
  if(
    state.scoring==="ppr"&&
    ["RB","WR","TE"].includes(player.pos)
  ){
    return 4;
  }

  if(
    state.scoring==="half"&&
    ["RB","WR"].includes(player.pos)
  ){
    return 2;
  }

  return 0;
}

function botScore(player){
  const value=
    Math.max(0,100-player.rank*.3);

  const need=
    needScore(player)*24;

  const scarcity=
    scarcityScore(player)*8;

  const tier=
    player.tier===1
      ? 8
      : player.tier===2
        ? 3
        : 0;

  const survival=
    survivalChance(player)*8;

  const reservePenalty=
    isReservePick(state.currentPick) &&
    ["K","DST"].includes(player.pos)
      ? 4
      : 0;

  return Math.round(
    value+
    need+
    scarcity+
    tier+
    survival+
    scoringBonus(player)-
    reservePenalty
  );
}

function recommendation(){
  return availablePlayers()
    .map(player=>({
      player:player,
      score:botScore(player)
    }))
    .sort((a,b)=>b.score-a.score)[0];
}

/* -------------------------------------------------------
   AKTIONEN UND UNDO
------------------------------------------------------- */

function saveUndo(){
  state.undo.push({
    teams:state.teams,
    slot:state.slot,
    scoring:state.scoring,
    roster:state.roster,
    currentPick:state.currentPick,
    drafted:JSON.parse(JSON.stringify(state.drafted)),
    history:JSON.parse(JSON.stringify(state.history))
  });

  if(state.undo.length>20){
    state.undo.shift();
  }
}

function makePick(id,kind){
  const player=getPlayer(id);

  if(!player||isGone(id)){
    showToast("Dieser Spieler ist bereits vom Board entfernt.");
    return;
  }

  if(state.currentPick>totalPicks()){
    showToast("Der Draft ist beendet.");
    return;
  }

  saveUndo();

  const entry={
    id:id,
    pick:state.currentPick,
    team:
      kind==="me"
        ? Number(state.slot)
        : teamAtPick(state.currentPick),
    kind:kind
  };

  state.drafted.push(entry);
  state.history.push(entry);
  state.currentPick++;

  saveState();
  render();

  showToast(
    kind==="me"
      ? player.name+" wurde in deinen Kader aufgenommen."
      : player.name+" wurde als Gegner-Pick markiert."
  );
}

function markAlreadyGone(id){
  const player=getPlayer(id);

  if(!player||isGone(id))return;

  const ok=confirm(
    player.name+
    " als bereits gepickt markieren?\n\n"+
    "Der Spieler verschwindet vom Board, "+
    "aber der Draft-Pick bleibt gleich."
  );

  if(!ok)return;

  saveUndo();

  const entry={
    id:id,
    pick:null,
    team:null,
    kind:"manual"
  };

  state.drafted.push(entry);
  state.history.push(entry);

  saveState();
  render();

  showToast(player.name+" wurde als bereits weg markiert.");
}

function undo(){
  if(!state.undo.length){
    showToast("Keine Aktion zum Rückgängigmachen.");
    return;
  }

  const old=state.undo.pop();

  state.teams=old.teams;
  state.slot=old.slot;
  state.scoring=old.scoring;
  state.roster=old.roster;
  state.currentPick=old.currentPick;
  state.drafted=old.drafted;
  state.history=old.history;

  saveState();
  fillSettings();
  render();

  showToast("Letzte Aktion wurde rückgängig gemacht.");
}

function resetDraft(){
  if(!confirm(
    "Draft, Kader, Verlauf und entfernte Spieler "+
    "wirklich zurücksetzen?"
  )){
    return;
  }

  state=defaultState();
  activeFilter="ALL";
  searchTerm="";
  searchInput.value="";

  saveState();
  fillSettings();
  render();

  showToast("Draft wurde zurückgesetzt.");
}

/* -------------------------------------------------------
   EINSTELLUNGEN
------------------------------------------------------- */

function fillSettings(){
  teamsSelect.innerHTML="";

  for(let teams=8;teams<=16;teams++){
    teamsSelect.innerHTML+=
      `<option value="${teams}">${teams} Teams</option>`;
  }

  teamsSelect.value=state.teams;
  fillSlots();

  scoringSelect.value=state.scoring;
  rosterSelect.value=state.roster;
}

function fillSlots(){
  slotSelect.innerHTML="";

  for(let slot=1;slot<=state.teams;slot++){
    slotSelect.innerHTML+=
      `<option value="${slot}">Slot ${slot}</option>`;
  }

  slotSelect.value=state.slot;
}

teamsSelect.addEventListener("change",()=>{
  state.teams=Number(teamsSelect.value);
  state.slot=1;
  state.currentPick=1;
  state.drafted=[];
  state.history=[];
  state.undo=[];

  fillSlots();
  saveState();
  render();
});

slotSelect.addEventListener("change",()=>{
  state.slot=Number(slotSelect.value);
  saveState();
  render();
});

scoringSelect.addEventListener("change",()=>{
  state.scoring=scoringSelect.value;
  saveState();
  render();
});

rosterSelect.addEventListener("change",()=>{
  state.roster=rosterSelect.value;
  state.currentPick=1;
  state.drafted=[];
  state.history=[];
  state.undo=[];

  saveState();
  render();
});

searchInput.addEventListener("input",()=>{
  searchTerm=
    searchInput.value.trim().toLowerCase();

  renderBoard();
});

document
  .getElementById("resetButton")
  .addEventListener("click",resetDraft);

document
  .getElementById("undoButton")
  .addEventListener("click",undo);

/* -------------------------------------------------------
   DARSTELLUNG
------------------------------------------------------- */

function renderStatus(){
  const shown=
    Math.min(state.currentPick,totalPicks());

  const round=
    Math.ceil(shown/state.teams);

  const next=
    nextOwnPick();

  statusBox.innerHTML=`
    <div class="status">
      <div class="stat">
        <strong>${shown}/${totalPicks()}</strong>
        <span>Pick</span>
      </div>

      <div class="stat">
        <strong>${round}/${totalRounds()}</strong>
        <span>Runde</span>
      </div>

      <div class="stat">
        <strong>${next||"—"}</strong>
        <span>Nächster eigener Pick</span>
      </div>
    </div>
  `;

  if(state.currentPick>totalPicks()){
    turnBox.innerHTML=`
      <div class="turn mine">
        <div class="sub">Draft beendet</div>
        <strong>🏁 Alle Picks abgeschlossen</strong>
      </div>
    `;

    return;
  }

  const team=
    teamAtPick(state.currentPick);

  const mine=
    isMyPick();

  const reserve=
    isReservePick(state.currentPick);

  turnBox.innerHTML=`
    <div class="turn ${mine?"mine":""}">
      <div class="sub">
        Pick #${state.currentPick} ·
        Runde ${Math.ceil(state.currentPick/state.teams)} ·
        Team ${team}
      </div>

      <strong>
        ${
          mine
            ? "🟢 DU BIST AM ZUG"
            : "🔵 Team "+team+" ist am Zug"
        }
      </strong>

      <div class="sub" style="margin-top:5px">
        ${reserve
          ? "🟣 Reserve-Runde · Spieler für die Bank"
          : "Starter-Runde"}
      </div>

      ${
        !mine&&next
          ? `<div class="sub" style="margin-top:4px">
              Noch ${next-state.currentPick}
              Pick(s) bis zu deinem Zug
            </div>`
          : ""
      }
    </div>
  `;
}

function renderRecommendation(){
  if(
    !isMyPick()||
    state.currentPick>totalPicks()
  ){
    recommendationBox.innerHTML=`
      <h2>🧠 DraftBot</h2>
      <div class="muted">
        Warte auf deinen nächsten eigenen Pick.
      </div>
    `;

    return;
  }

  const rec=recommendation();

  if(!rec){
    recommendationBox.innerHTML=
      "<h2>Keine Spieler mehr verfügbar.</h2>";
    return;
  }

  const player=rec.player;
  const chance=survivalChance(player);
  const next=nextOwnPick();

  const alternatives=
    availablePlayers()
      .filter(item=>item.id!==player.id)
      .map(item=>({
        player:item,
        score:botScore(item)
      }))
      .sort((a,b)=>b.score-a.score)
      .slice(0,3);

  const reasons=[];

  if(player.rank<=25){
    reasons.push("hoher Player Value");
  }

  if(needScore(player)>=.8){
    reasons.push("passt zu deinem aktuellen Kader");
  }

  if(scarcityScore(player)>.85){
    reasons.push("Position wird schnell knapp");
  }

  if(player.tier<=2){
    reasons.push("starkes Tier");
  }

  if(isReservePick(state.currentPick)){
    reasons.push("passt in die Reserve-Phase");
  }

  reasons.push(
    chance<.55
      ? "wird wahrscheinlich vor deinem nächsten Pick gedraftet"
      : "gute Chance, dass er verfügbar bleibt"
  );

  recommendationBox.innerHTML=`
    <div class="bot-score">${rec.score}</div>

    <div class="sub">
      🧠 DRAFTBOT EMPFIEHLT
    </div>

    <div class="recommended-name">
      ${escapeHtml(player.name)}
    </div>

    <span class="badge">
      ${escapeHtml(positionLabel(player))}
    </span>

    <span class="badge">
      ${escapeHtml(player.team)}
    </span>

    <span class="badge">
      ADP ${player.adp.toFixed(1)}
    </span>

    <span class="badge">
      Tier ${player.tier}
    </span>

    <h3>Warum?</h3>

    <ul class="reason">
      ${reasons.map(x=>`<li>${x}</li>`).join("")}
    </ul>

    <div class="badge">
      ${
        chance>=.55
          ? "🟢 Wahrscheinlich verfügbar"
          : "🔴 Wahrscheinlich vorher weg"
      }

      ${next?" bei Pick #"+next:""}
    </div>

    <div style="margin-top:11px">
      <button id="recommendButton" class="primary">
        ✓ Empfehlung picken
      </button>
    </div>

    <h3>Alternativen</h3>

    <div class="reason">
      ${
        alternatives.length
          ? alternatives
              .map((item,index)=>
                `${index+1}. ${escapeHtml(item.player.name)}`
              )
              .join("<br>")
          : "Keine Alternativen."
      }
    </div>
  `;

  document
    .getElementById("recommendButton")
    .addEventListener("click",()=>{
      makePick(player.id,"me");
    });
}

function renderFilters(){
  const filters=[
    "ALL",
    "QB",
    "RB",
    "WR",
    "TE",
    "K",
    "DST"
  ];

  filterBox.innerHTML=
    filters
      .map(filter=>`
        <button
          class="${activeFilter===filter?"active":""}"
          data-filter="${filter}">
          ${filter}
        </button>
      `)
      .join("");

  filterBox
    .querySelectorAll("[data-filter]")
    .forEach(button=>{
      button.addEventListener("click",()=>{
        activeFilter=
          button.dataset.filter;

        renderBoard();
      });
    });
}

function matchesSearch(player){
  if(!searchTerm)return true;

  const values=[
    player.name,
    player.team,
    player.pos,
    positionLabel(player),
    String(player.rank),
    String(player.adp)
  ];

  return values.some(value=>
    String(value).toLowerCase().includes(searchTerm)
  );
}

function renderBoard(){
  renderFilters();

  const list=
    getAvailablePlayers()
      .filter(player=>{
        const filterMatch=
          activeFilter==="ALL"||
          player.pos===activeFilter;

        return filterMatch&&matchesSearch(player);
      });

  availableCount.textContent=
    getAvailablePlayers().length+
    " verfügbar · "+
    list.length+
    " angezeigt";

  if(!list.length){
    boardBox.innerHTML=`
      <div class="empty">
        Keine Spieler gefunden.
      </div>
    `;

    return;
  }

  boardBox.innerHTML=
    list
      .map(player=>{
        const mine=isMyPick();

        return`
          <div class="player">
            <div class="player-main">
              <div class="avatar">
                ${escapeHtml(initials(player.name))}
              </div>

              <div>
                <div class="player-name">
                  ${escapeHtml(player.name)}
                </div>

                <div class="player-meta">
                  <strong>${escapeHtml(positionLabel(player))}</strong>
                  · ${escapeHtml(player.team)}
                  · ADP ${player.adp.toFixed(1)}
                  · Rank #${player.rank}
                  · Tier ${player.tier}
                  · Bot ${botScore(player)}
                </div>
              </div>
            </div>

            <div class="actions">
              <button
                class="pick-button"
                data-action="${mine?"mine":"opponent"}"
                data-id="${escapeHtml(player.id)}">
                ${mine?"PICK":"GEGNER-PICK"}
              </button>

              <button
                class="gone-button"
                data-action="manual"
                data-id="${escapeHtml(player.id)}">
                BEREITS WEG
              </button>
            </div>
          </div>
        `;
      })
      .join("");

  boardBox
    .querySelectorAll("[data-action]")
    .forEach(button=>{
      button.addEventListener("click",()=>{
        const action=
          button.dataset.action;

        const id=
          button.dataset.id;

        if(action==="manual"){
          markAlreadyGone(id);
        }else if(action==="mine"){
          makePick(id,"me");
        }else{
          makePick(id,"opponent");
        }
      });
    });
}

function renderHistory(){
  if(!state.history.length){
    historyBox.innerHTML=
      `<div class="empty">
        Noch keine Picks.
      </div>`;

    return;
  }

  historyBox.innerHTML=
    state.history
      .slice()
      .reverse()
      .map(entry=>{
        const player=
          getPlayer(entry.id);

        if(entry.kind==="manual"){
          return`
            <div class="history-row">
              🟣 Bereits weg ·
              ${player?escapeHtml(player.name):"Unbekannt"}
              <span class="muted">
                ${player
                  ? escapeHtml(
                      positionLabel(player)+
                      " · "+
                      player.team
                    )
                  : ""}
              </span>
            </div>
          `;
        }

        const mine=
          entry.team===Number(state.slot);

        return`
          <div class="history-row ${mine?"mine":""}">
            #${entry.pick} ·
            Team ${entry.team} ·
            ${player?escapeHtml(player.name):"Unbekannt"}
            <span class="muted">
              ${player
                ? escapeHtml(
                    positionLabel(player)+
                    " · "+
                    player.team
                  )
                : ""}
            </span>
          </div>
        `;
      })
      .join("");
}

function render(){
  teamsSelect.value=state.teams;
  slotSelect.value=state.slot;
  scoringSelect.value=state.scoring;
  rosterSelect.value=state.roster;

  renderStatus();
  renderRecommendation();
  renderRoster();
  renderBoard();
  renderHistory();
}

/* -------------------------------------------------------
   START
------------------------------------------------------- */

loadState();
buildPlayers();
fillSettings();
render();

</script>
