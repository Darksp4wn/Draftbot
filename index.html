<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101d">
<title>DraftBot 2026</title>

<style>
:root{
  --bg:#08101d;
  --card:#141e31;
  --card2:#1d2a43;
  --border:#30415f;
  --text:#f5f7ff;
  --muted:#9ba9c3;
  --green:#55d6a4;
  --blue:#69adff;
  --red:#ff7180;
  --yellow:#ffd166;
  --purple:#a78bfa;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  overflow-x:hidden;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-overflow-scrolling:touch;
}

button,select{
  font:inherit;
}

button{
  border:0;
  border-radius:11px;
  padding:11px 13px;
  background:var(--card2);
  color:var(--text);
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.5;
}

button.primary{
  background:var(--green);
  color:#06140f;
  font-weight:800;
}

button.danger{
  background:#642b39;
}

button.small{
  padding:7px 10px;
  font-size:12px;
}

select{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card2);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:13px 14px;
  background:#08101ded;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

main{
  max-width:1280px;
  margin:auto;
  padding:12px 12px 140px;
}

h1{
  margin:0;
  font-size:21px;
}

h2{
  margin:0 0 12px;
  font-size:16px;
}

h3{
  margin:13px 0 7px;
  font-size:14px;
}

.sub,.muted{
  color:var(--muted);
  font-size:12px;
}

.between{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.layout{
  display:grid;
  gap:12px;
}

@media(min-width:900px){
  .layout{
    grid-template-columns:390px minmax(0,1fr);
  }
}

.card{
  padding:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.settings label{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:var(--muted);
  font-size:12px;
}

.status{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:12px;
}

.stat{
  padding:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:19px;
}

.stat span{
  color:var(--muted);
  font-size:11px;
}

.turn{
  margin-bottom:12px;
  padding:14px;
  background:var(--card2);
  border-radius:14px;
}

.turn.mine{
  background:#12372e;
  outline:2px solid var(--green);
}

.turn strong{
  display:block;
  margin-top:3px;
  font-size:19px;
}

.recommendation{
  background:linear-gradient(135deg,#14382f,#17253d);
  border-color:#347862;
}

@media(min-width:900px){
  .recommendation{
    position:sticky;
    top:76px;
    z-index:5;
  }
}

.bot-score{
  float:right;
  color:var(--yellow);
  font-size:28px;
  font-weight:900;
}

.recommended-name{
  margin:4px 0;
  font-size:23px;
  font-weight:850;
}

.badge{
  display:inline-block;
  margin:2px;
  padding:3px 8px;
  background:#30415e;
  border-radius:20px;
  color:#e0ebff;
  font-size:11px;
}

.reason{
  margin:7px 0;
  padding-left:20px;
  color:#d9e3f5;
  font-size:13px;
  line-height:1.5;
}

.filters{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:8px;
  -webkit-overflow-scrolling:touch;
}

.filters button{
  flex:0 0 auto;
  padding:8px 11px;
}

.filters button.active{
  background:var(--blue);
  color:#061321;
  font-weight:800;
}

.board{
  display:grid;
  gap:8px;
  max-height:min(64vh,720px);
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:3px;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

.player{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
  min-height:78px;
  padding:8px;
  background:#111a2c;
  border:1px solid var(--border);
  border-radius:12px;
}

.player-main{
  display:flex;
  align-items:center;
  min-width:0;
  gap:9px;
}

.player-image{
  width:46px;
  height:46px;
  flex:0 0 46px;
  object-fit:cover;
  border-radius:50%;
  background:#304363;
}

.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e4edff;
  font-size:12px;
  font-weight:800;
}

.player-name{
  overflow-wrap:anywhere;
  font-weight:750;
}

.player-meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.rank{
  color:var(--yellow);
}

.actions{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.actions button{
  min-width:98px;
  padding:8px 5px;
  font-size:10px;
  font-weight:800;
}

.pick-button{
  background:#245d75;
}

.gone-button{
  background:#513d66;
  color:#eee5ff;
}

.roster{
  display:grid;
  gap:5px;
}

.roster-row{
  display:flex;
  justify-content:space-between;
  padding:8px 10px;
  background:#111a2c;
  border-radius:8px;
}

.roster-row small{
  color:var(--muted);
}

.history{
  max-height:400px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.history-row{
  padding:7px;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.history-row.mine{
  color:var(--green);
  font-weight:750;
}

.loading{
  padding:25px;
  color:var(--muted);
  text-align:center;
}

.error{
  padding:12px;
  background:#4a2633;
  border:1px solid #8c4654;
  border-radius:10px;
  color:#ffd8dc;
  font-size:13px;
  line-height:1.5;
}

.empty{
  padding:20px;
  color:var(--muted);
  text-align:center;
}

.flex{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.toast{
  position:fixed;
  right:12px;
  bottom:18px;
  left:12px;
  z-index:100;
  display:none;
  padding:12px 14px;
  background:var(--green);
  color:#06140f;
  border-radius:12px;
  box-shadow:0 8px 30px #0008;
  font-weight:750;
}

@media(max-width:600px){
  main{
    padding-right:9px;
    padding-left:9px;
  }

  .player-image{
    width:42px;
    height:42px;
    flex-basis:42px;
  }

  .actions button{
    min-width:91px;
  }
}

function defaultState(){

function saveState(){

function loadState(){
  try{

  }catch(error){

  }

  if(!Array.isArray(state.drafted)){

}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  return String(name || "?")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function normalizeName(name){
  return String(name || "")
    .toLowerCase()
    .replace(/[.'’‘"`]/g,"")
    .replace(/\b(jr|sr|ii|iii|iv)\b/g,"")
    .replace(/[^a-z0-9]/g,"");
}

function showToast(message){

}

function nearestAdpTeams(value){
  return adpTeams.reduce((best,current)=>{
    return Math.abs(current-value) <
      Math.abs(best-value)
      ? current
      : best;
  });
}

function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function fetchWithTimeout(url,timeout=7000){
  const controller = new AbortController();

  const timer = setTimeout(()=>{
    controller.abort();
  },timeout);

  try{
    const response = await fetch(url,{
      method:"GET",
      mode:"cors",
      cache:"no-store",
      signal:controller.signal,
      headers:{
        "Accept":"application/json"
      }
    });

    return response;
  }finally{
    clearTimeout(timer);
  }
}

/* --------------------------------------------------
   FALLBACK-DATEN
-------------------------------------------------- */

function buildFallbackPlayers(){
  const result = [];

  const base = {
    QB:55,
    RB:100,
    WR:98,
    TE:65,
    K:12,
    DST:11
  };

  ["QB","RB","WR","TE","K","DST"].forEach(pos=>{
    const rows = fallbackData[pos]
      .split(";")
      .map(row=>row.trim())
      .filter(Boolean);

    rows.forEach((row,index)=>{
      const parts = row.split("|");

      result.push({
        id:"fallback-"+pos+"-"+index,
        name:parts[0],
        team:parts[1] || "FA",
        pos:pos,
        positionRank:index+1,
        adp:0,
        image:"",
        rank:0,
        tier:
          index<3 ? 1 :
          index<8 ? 2 :
          index<16 ? 3 :
          index<28 ? 4 : 5
      });
    });
  });

  result.sort((a,b)=>{
    return (
      base[b.pos]-b.positionRank
    ) - (
      base[a.pos]-a.positionRank
    );
  });

  result.forEach((player,index)=>{
    player.rank = index+1;
    player.adp = index+1;
  });

  return result;
}

/* --------------------------------------------------
   LIVE-ADP
-------------------------------------------------- */

function readArray(data){
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.players)) return data.players;
  if(Array.isArray(data.data)) return data.data;
  if(Array.isArray(data.results)) return data.results;
  return [];
}

function field(object,names){
  for(const name of names){
    if(
      object &&
      object[name] !== undefined &&
      object[name] !== null
    ){
      return object[name];
    }
  }

  return "";
}

function parseAdpRow(row){
  const name = field(row,[
    "name",
    "player",
    "full_name",
    "player_name"
  ]);

  const team = field(row,[
    "team",
    "team_abbr",
    "tm"
  ]);

  let pos = String(field(row,[
    "position",
    "pos"
  ])).toUpperCase();

  const adpValue = Number(field(row,[
    "adp",
    "average",
    "overall",
    "draft_position",
    "rank"
  ]));

  if(pos==="DEF" || pos==="D/ST"){
    pos="DST";
  }

  if(
    !name ||
    !["QB","RB","WR","TE","K","DST"].includes(pos) ||
    !Number.isFinite(adpValue)
  ){
    return null;
  }

  return {
    name:String(name),
    team:String(team || "FA"),
    pos:pos,
    adp:adpValue
  };
}

async function requestAdp(format,teams){
  const url =
    "https://fantasyfootballcalculator.com/api/v1/adp/" +
    encodeURIComponent(format) +
    "?teams=" + encodeURIComponent(teams) +
    "&year=" + YEAR;

  const response =
    await fetchWithTimeout(url,7000);

  if(!response.ok){
    throw new Error("HTTP "+response.status);
  }

  const data = await response.json();

  return readArray(data)
    .map(parseAdpRow)
    .filter(Boolean);
}

async function loadLiveAdp(){
  const teams = nearestAdpTeams(Number(state.teams));
  const formats = adpFormats[state.scoring];

  let lastError = null;

  for(const format of formats){
    try{
      const result =
        await requestAdp(format,teams);

      if(result.length >= 20){
        return {
          players:result,
          sourceTeams:teams,
          format:format
        };
      }
    }catch(error){
      lastError = error;
    }

    await wait(100);
  }

  throw lastError ||
    new Error("Keine ADP-Daten erhalten.");
}

function buildLivePlayers(adpPlayers){
  const sorted =
    adpPlayers
      .slice()
      .sort((a,b)=>a.adp-b.adp);

  const positionRank = {
    QB:0,
    RB:0,
    WR:0,
    TE:0,
    K:0,
    DST:0
  };

  const output = sorted.map((item,index)=>{
    positionRank[item.pos]++;

    return {
      id:
        "live-" +
        normalizeName(item.name) +
        "-" +
        item.pos,

      name:item.name,
      team:item.team,
      pos:item.pos,
      adp:item.adp,
      rank:index+1,
      positionRank:positionRank[item.pos],
      tier:
        index<24 ? 1 :
        index<65 ? 2 :
        index<120 ? 3 :
        index<190 ? 4 : 5,
      image:"",
      source:"live"
    };
  });

  const unique = new Map();

  output.forEach(player=>{
    const key =
      normalizeName(player.name)+"|"+player.pos;

    if(!unique.has(key)){
      unique.set(key,player);
    }
  });

  return Array.from(unique.values())
    .sort((a,b)=>a.adp-b.adp)
    .map((player,index)=>({
      ...player,
      rank:index+1
    }));
}

async function loadPlayerData(){
  if(loadingData) return;

  loadingData = true;
  refreshButton.disabled = true;
  loadingBox.style.display = "block";
  app.style.display = "none";
  loadingBox.textContent =
    "Lade aktuelle ADP-Durchschnittswerte …";

  try{
    const live =
      await loadLiveAdp();

    players =
      buildLivePlayers(live.players);

    state.dataMode = "live";
    state.updatedAt = new Date().toISOString();

    dataStatus.textContent =
      players.length+
      " Spieler · Live-ADP · "+
      live.sourceTeams+
      " Teams";

    saveState();
    fillSettings();

    loadingBox.style.display = "none";
    app.style.display = "grid";
    render();

    showToast(
      "Aktuelle ADP-Daten geladen."
    );
  }catch(error){
    console.warn(
      "Live-ADP nicht erreichbar. Lokaler Fallback wird verwendet.",
      error
    );

    players =
      buildFallbackPlayers();

    state.dataMode = "fallback";
    state.updatedAt = new Date().toISOString();

    dataStatus.textContent =
      players.length+
      " Spieler · lokale Fallback-Daten";

    saveState();
    fillSettings();

    loadingBox.style.display = "none";
    app.style.display = "grid";
    render();

    showToast(
      "Live-ADP nicht erreichbar. Draft läuft mit Fallback-Daten."
    );
  }finally{
    loadingData = false;
    refreshButton.disabled = false;
  }
}

/* --------------------------------------------------
   SNAKE-DRAFT
-------------------------------------------------- */

function totalRounds(){
  if(state.roster==="threeWR") return 10;
  if(state.roster==="superflex") return 10;
  return 9;
}

function totalPicks(){
  return state.teams*totalRounds();
}

function teamAtPick(pick){
  const round =
    Math.floor((pick-1)/state.teams);

  const position =
    (pick-1)%state.teams;

  return round%2===0
    ? position+1
    : state.teams-position;
}

function isMyPick(pick=state.currentPick){
  return teamAtPick(pick)===Number(state.slot);
}

function nextOwnPick(){
  for(
    let pick=state.currentPick+1;
    pick<=totalPicks();
    pick++
  ){
    if(isMyPick(pick)) return pick;
  }

  return null;
}

/* --------------------------------------------------
   PICK-MECHANIK
-------------------------------------------------- */

function getPlayer(id){
  return players.find(player=>player.id===id);
}

function getDraftedEntry(id){
  return state.drafted.find(item=>item.id===id);
}

function isGone(id){
  return Boolean(getDraftedEntry(id));
}

function availablePlayers(){
  return players.filter(player=>!isGone(player.id));
}

function saveUndo(){
  state.undo.push({
    teams:state.teams,
    slot:state.slot,
    scoring:state.scoring,
    roster:state.roster,
    currentPick:state.currentPick,
    drafted:JSON.parse(JSON.stringify(state.drafted)),
    history:JSON.parse(JSON.stringify(state.history))
  });

  if(state.undo.length>20){
    state.undo.shift();
  }
}

function makePick(id,kind){
  const player = getPlayer(id);

  if(!player || isGone(id)){
    showToast("Spieler ist bereits vom Board entfernt.");
    return;
  }

  if(state.currentPick>totalPicks()){
    showToast("Der Draft ist beendet.");
    return;
  }

  saveUndo();

  const entry = {
    id:id,
    pick:state.currentPick,
    team:
      kind==="me"
        ? Number(state.slot)
        : teamAtPick(state.currentPick),
    kind:kind
  };

  state.drafted.push(entry);
  state.history.push(entry);
  state.currentPick++;

  saveState();
  render();

  showToast(
    kind==="me"
      ? player.name+" wurde in deinen Kader aufgenommen."
      : player.name+" wurde als Gegner-Pick markiert."
  );
}

function markAlreadyGone(id){
  const player = getPlayer(id);

  if(!player || isGone(id)) return;

  const ok = confirm(
    player.name+
    " als bereits gepickt markieren?\n\n"+
    "Der Spieler verschwindet vom Board, "+
    "aber der Draft-Pick erhöht sich nicht."
  );

  if(!ok) return;

  saveUndo();

  const entry = {
    id:id,
    pick:null,
    team:null,
    kind:"manual"
  };

  state.drafted.push(entry);
  state.history.push(entry);

  saveState();
  render();

  showToast(player.name+" wurde als bereits weg markiert.");
}

function undoLast(){
  if(!state.undo.length){
    showToast("Keine Aktion zum Rückgängigmachen.");
    return;
  }

  const old = state.undo.pop();

  state.teams = old.teams;
  state.slot = old.slot;
  state.scoring = old.scoring;
  state.roster = old.roster;
  state.currentPick = old.currentPick;
  state.drafted = old.drafted;
  state.history = old.history;

  saveState();
  fillSettings();
  render();

  showToast("Letzte Aktion wurde rückgängig gemacht.");
}

function resetDraft(){
  if(!confirm(
    "Draft, Kader, Verlauf und entfernte Spieler "+
    "wirklich zurücksetzen?"
  )){
    return;
  }

  state = defaultState();
  activeFilter = "ALL";

  saveState();
  fillSettings();
  render();

  showToast("Draft wurde zurückgesetzt.");
}

/* --------------------------------------------------
   ROSTER
-------------------------------------------------- */

function rosterLimits(){
  if(state.roster==="threeWR"){
    return {
      QB:1,
      RB:2,
      WR:3,
      TE:1,
      FLEX:1,
      K:1,
      DST:1
    };
  }

  if(state.roster==="superflex"){
    return {
      QB:1,
      RB:2,
      WR:2,
      TE:1,
      FLEX:1,
      SF:1,
      K:1,
      DST:1
    };
  }

  return {
    QB:1,
    RB:2,
    WR:2,
    TE:1,
    FLEX:1,
    K:1,
    DST:1
  };
}

function myPlayers(){
  return state.drafted
    .filter(item=>item.team===Number(state.slot))
    .map(item=>getPlayer(item.id))
    .filter(Boolean);
}

function myCounts(){
  const result = {
    QB:0,
    RB:0,
    WR:0,
    TE:0,
    K:0,
    DST:0
  };

  myPlayers().forEach(player=>{
    result[player.pos]++;
  });

  return result;
}

/* --------------------------------------------------
   DRAFTBOT
-------------------------------------------------- */

function needScore(player){
  const counts = myCounts();
  const limits = rosterLimits();

  if(player.pos==="QB" && counts.QB<limits.QB) return 1;
  if(player.pos==="RB" && counts.RB<limits.RB) return 1;
  if(player.pos==="WR" && counts.WR<limits.WR) return 1;
  if(player.pos==="TE" && counts.TE<limits.TE) return 1;

  if(player.pos==="K" && counts.K<limits.K) return .4;
  if(player.pos==="DST" && counts.DST<limits.DST) return .4;

  if(
    ["RB","WR","TE"].includes(player.pos) &&
    counts.RB+counts.WR+counts.TE <
    limits.RB+limits.WR+limits.TE+1
  ){
    return .5;
  }

  if(
    state.roster==="superflex" &&
    player.pos==="QB" &&
    counts.QB<2
  ){
    return .75;
  }

  return .08;
}

function scarcityScore(player){
  const same =
    availablePlayers()
      .filter(item=>item.pos===player.pos)
      .sort((a,b)=>a.positionRank-b.positionRank);

  const index =
    same.findIndex(item=>item.id===player.id);

  if(index<0) return 0;

  const tierRemaining =
    same.filter(item=>item.tier===player.tier).length;

  const rankScarcity =
    1-index/Math.max(1,same.length);

  return rankScarcity+
    (tierRemaining<=2?.35:0);
}

function survivalChance(player){
  const next = nextOwnPick();

  if(!next) return 1;

  const distance =
    Math.max(0,next-state.currentPick-1);

  let risk=.006;

  if(player.rank<=30) risk=.025;
  else if(player.rank<=80) risk=.014;
  else if(player.rank<=130) risk=.008;

  return Math.max(
    0,
    Math.min(1,1-risk*distance)
  );
}

function scoringBonus(player){
  if(
    state.scoring==="ppr" &&
    ["RB","WR","TE"].includes(player.pos)
  ){
    return 4;
  }

  if(
    state.scoring==="half" &&
    ["RB","WR"].includes(player.pos)
  ){
    return 2;
  }

  return 0;
}

function botScore(player){
  const value =
    Math.max(0,100-player.rank*.3);

  const need =
    needScore(player)*24;

  const scarcity =
    scarcityScore(player)*8;

  const tier =
    player.tier===1
      ? 8
      : player.tier===2
        ? 3
        : 0;

  const survival =
    survivalChance(player)*8;

  return Math.round(
    value+
    need+
    scarcity+
    tier+
    survival+
    scoringBonus(player)
  );
}

function getRecommendation(){
  return availablePlayers()
    .map(player=>({
      player:player,
      score:botScore(player)
    }))
    .sort((a,b)=>b.score-a.score)[0];
}

/* --------------------------------------------------
   EINSTELLUNGEN
-------------------------------------------------- */

function fillSettings(){
  teamsSelect.innerHTML="";

  for(let teams=8;teams<=16;teams++){
    teamsSelect.innerHTML+=
      `<option value="${teams}">${teams} Teams</option>`;
  }

  teamsSelect.value=state.teams;
  fillSlots();

  scoringSelect.value=state.scoring;
  rosterSelect.value=state.roster;
}

function fillSlots(){
  slotSelect.innerHTML="";

  for(let slot=1;slot<=state.teams;slot++){
    slotSelect.innerHTML+=
      `<option value="${slot}">Slot ${slot}</option>`;
  }

  slotSelect.value=state.slot;
}

teamsSelect.addEventListener("change",()=>{
  state.teams = Number(teamsSelect.value);
  state.slot = 1;
  state.currentPick = 1;
  state.drafted = [];
  state.history = [];
  state.undo = [];

  fillSlots();
  saveState();
  render();
});

slotSelect.addEventListener("change",()=>{
  state.slot = Number(slotSelect.value);
  saveState();
  render();
});

scoringSelect.addEventListener("change",()=>{
  state.scoring = scoringSelect.value;
  state.currentPick = 1;
  state.drafted = [];
  state.history = [];
  state.undo = [];

  saveState();
  render();

  loadPlayerData();
});

rosterSelect.addEventListener("change",()=>{
  state.roster = rosterSelect.value;
  state.currentPick = 1;
  state.drafted = [];
  state.history = [];
  state.undo = [];

  saveState();
  render();
});

refreshButton.addEventListener("click",()=>{
  loadPlayerData();
});

resetButton.addEventListener("click",resetDraft);
undoButton.addEventListener("click",undoLast);

/* --------------------------------------------------
   DARSTELLUNG
-------------------------------------------------- */

function renderStatus(){
  const shown =
    Math.min(state.currentPick,totalPicks());

  const round =
    Math.ceil(shown/state.teams);

  const next =
    nextOwnPick();

  statusBox.innerHTML=`
    <div class="status">
      <div class="stat">
        <strong>${shown}/${totalPicks()}</strong>
        <span>Pick</span>
      </div>

      <div class="stat">
        <strong>${round}</strong>
        <span>Runde</span>
      </div>

      <div class="stat">
        <strong>${next||"—"}</strong>
        <span>Nächster eigener Pick</span>
      </div>
    </div>
  `;

  if(state.currentPick>totalPicks()){
    turnBox.innerHTML=`
      <div class="turn mine">
        <div class="sub">Draft beendet</div>
        <strong>🏁 Alle Picks abgeschlossen</strong>
      </div>
    `;

    return;
  }

  const team =
    teamAtPick(state.currentPick);

  const mine =
    isMyPick();

  turnBox.innerHTML=`
    <div class="turn ${mine?"mine":""}">
      <div class="sub">
        Pick #${state.currentPick} · Team ${team}
      </div>

      <strong>
        ${
          mine
            ? "🟢 DU BIST AM ZUG"
            : "🔵 Team "+team+" ist am Zug"
        }
      </strong>

      ${
        !mine && next
          ? `<div class="sub">
              Noch ${next-state.currentPick}
              Pick(s) bis zu deinem Zug
            </div>`
          : ""
      }
    </div>
  `;
}

function renderRecommendation(){
  if(
    !isMyPick() ||
    state.currentPick>totalPicks()
  ){
    recommendationBox.innerHTML=`
      <h2>🧠 DraftBot</h2>
      <div class="muted">
        Warte auf deinen nächsten eigenen Pick.
      </div>
    `;

    return;
  }

  const rec =
    getRecommendation();

  if(!rec){
    recommendationBox.innerHTML=
      "<h2>Keine Spieler mehr verfügbar.</h2>";
    return;
  }

  const player =
    rec.player;

  const next =
    nextOwnPick();

  const chance =
    survivalChance(player);

  const alternatives =
    availablePlayers()
      .filter(item=>item.id!==player.id)
      .map(item=>({
        player:item,
        score:botScore(item)
      }))
      .sort((a,b)=>b.score-a.score)
      .slice(0,3);

  const reasons=[];

  if(player.rank<=25){
    reasons.push("hoher Player Value");
  }

  if(needScore(player)>=.8){
    reasons.push("passt zu deinem aktuellen Kader");
  }

  if(scarcityScore(player)>.85){
    reasons.push("Position wird schnell knapp");
  }

  if(player.tier<=2){
    reasons.push("starkes Tier");
  }

  reasons.push(
    chance<.55
      ? "wird wahrscheinlich vorher gedraftet"
      : "gute Chance, dass er verfügbar bleibt"
  );

  recommendationBox.innerHTML=`
    <div class="bot-score">${rec.score}</div>

    <div class="sub">
      🧠 DRAFTBOT EMPFIEHLT
    </div>

    <div class="recommended-name">
      ${escapeHtml(player.name)}
    </div>

    <span class="badge">
      ${escapeHtml(player.pos)} · ${escapeHtml(player.team)}
    </span>

    <span class="badge">
      ADP ${Number(player.adp).toFixed(1)}
    </span>

    <span class="badge">
      Rank #${player.rank}
    </span>

    <span class="badge">
      Tier ${player.tier}
    </span>

    <h3>Warum?</h3>

    <ul class="reason">
      ${reasons.map(x=>`<li>${x}</li>`).join("")}
    </ul>

    <div class="badge">
      ${
        chance>=.55
          ? "🟢 Wahrscheinlich verfügbar"
          : "🔴 Wahrscheinlich vorher weg"
      }

      ${next ? " bei Pick #"+next : ""}
    </div>

    <div style="margin-top:11px">
      <button id="recommendButton" class="primary">
        ✓ Empfehlung picken
      </button>
    </div>

    <h3>Alternativen</h3>

    <div class="reason">
      ${
        alternatives.length
          ? alternatives
              .map((item,index)=>
                `${index+1}. ${escapeHtml(item.player.name)}`
              )
              .join("<br>")
          : "Keine Alternativen."
      }
    </div>
  `;

  document
    .getElementById("recommendButton")
    .addEventListener("click",()=>{
      makePick(player.id,"me");
    });
}

function renderRoster(){
  const counts =
    myCounts();

  const limits =
    rosterLimits();

  let html="";

  ["QB","RB","WR","TE","K","DST"]
    .forEach(pos=>{
      html+=`
        <div class="roster-row">
          <span>${pos}</span>
          <strong>${counts[pos]}/${limits[pos]}</strong>
        </div>
      `;
    });

  html+=`
    <div class="roster-row">
      <span>FLEX <small>RB / WR / TE</small></span>
      <strong>—/${limits.FLEX}</strong>
    </div>
  `;

  if(state.roster==="superflex"){
    html+=`
      <div class="roster-row">
        <span>SF <small>QB / RB / WR / TE</small></span>
        <strong>—/1</strong>
      </div>
    `;
  }

  rosterBox.innerHTML=html;
}

function renderFilters(){
  filterBox.innerHTML=
    positions.map(filter=>`
      <button
        class="${activeFilter===filter?"active":""}"
        data-filter="${filter}">
        ${filter}
      </button>
    `).join("");

  filterBox
    .querySelectorAll("[data-filter]")
    .forEach(button=>{
      button.addEventListener("click",()=>{
        activeFilter =
          button.dataset.filter;

        renderBoard();
      });
    });
}

function avatarHtml(player){
  const text =
    escapeHtml(initials(player.name));

  if(!player.image){
    return `
      <div class="player-image avatar">
        ${text}
      </div>
    `;
  }

  return `
    <img
      class="player-image"
      src="${escapeHtml(player.image)}"
      alt=""
      loading="lazy"
      onerror="this.outerHTML='<div class=&quot;player-image avatar&quot;>${text}</div>'">
  `;
}

function renderBoard(){
  renderFilters();

  const list =
    availablePlayers()
      .filter(player=>{
        return activeFilter==="ALL" ||
          player.pos===activeFilter;
      });

  availableCount.textContent =
    availablePlayers().length+" verfügbar";

  if(!list.length){
    boardBox.innerHTML=
      `<div class="empty">
        Keine Spieler in diesem Filter verfügbar.
      </div>`;

    return;
  }

  boardBox.innerHTML =
    list.map(player=>{
      const mine =
        isMyPick();

      return `
        <div class="player">
          <div class="player-main">
            ${avatarHtml(player)}

            <div>
              <div class="player-name">
                ${escapeHtml(player.name)}
              </div>

              <div class="player-meta">
                ${escapeHtml(player.pos)} ·
                ${escapeHtml(player.team)} ·
                <span class="rank">
                  ADP ${Number(player.adp).toFixed(1)}
                </span>
                · Rank #${player.rank}
                · Tier ${player.tier}
                · Bot ${botScore(player)}
              </div>
            </div>
          </div>

          <div class="actions">
            <button
              class="pick-button"
              data-action="${mine?"mine":"opponent"}"
              data-id="${escapeHtml(player.id)}">
              ${mine?"PICK":"GEGNER-PICK"}
            </button>

            <button
              class="gone-button"
              data-action="manual"
              data-id="${escapeHtml(player.id)}">
              BEREITS WEG
            </button>
          </div>
        </div>
      `;
    }).join("");

  boardBox
    .querySelectorAll("[data-action]")
    .forEach(button=>{
      button.addEventListener("click",()=>{
        const action =
          button.dataset.action;

        const id =
          button.dataset.id;

        if(action==="manual"){
          markAlreadyGone(id);
        }else if(action==="mine"){
          makePick(id,"me");
        }else{
          makePick(id,"opponent");
        }
      });
    });
}

function renderHistory(){
  if(!state.history.length){
    historyBox.innerHTML=
      `<div class="empty">Noch keine Picks.</div>`;
    return;
  }

  historyBox.innerHTML =
    state.history
      .slice()
      .reverse()
      .map(entry=>{
        const player =
          getPlayer(entry.id);

        if(entry.kind==="manual"){
          return `
            <div class="history-row">
              🟣 Bereits weg ·
              ${player ? escapeHtml(player.name) : "Unbekannt"}
              <span class="muted">
                ${player
                  ? escapeHtml(player.pos+" · "+player.team)
                  : ""}
              </span>
            </div>
          `;
        }

        const mine =
          entry.team===Number(state.slot);

        return `
          <div class="history-row ${mine?"mine":""}">
            #${entry.pick} ·
            Team ${entry.team} ·
            ${player ? escapeHtml(player.name) : "Unbekannt"}
            <span class="muted">
              ${player
                ? escapeHtml(player.pos+" · "+player.team)
                : ""}
            </span>
          </div>
        `;
      })
      .join("");
}

function render(){
  teamsSelect.value =
    state.teams;

  slotSelect.value =
    state.slot;

  scoringSelect.value =
    state.scoring;

  rosterSelect.value =
    state.roster;

  renderStatus();
  renderRecommendation();
  renderRoster();
  renderBoard();
  renderHistory();
}

/* --------------------------------------------------
   START
-------------------------------------------------- */

loadState();
fillSettings();
loadPlayerData();
</script>
